services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-transferencia
    ports:
      - "5672:5672"    # Porta AMQP
      - "15672:15672"  # Painel Web de Gestão (login: guest / senha: guest)
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    restart: unless-stopped
