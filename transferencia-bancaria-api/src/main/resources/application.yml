spring:
  datasource:
    url: jdbc:h2:mem:transferenciadb;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
          multiplier: 2.0

app:
  rabbitmq:
    exchange:
      transferencia: transferencia.exchange
      dlx: transferencia.dlx
    queue:
      transferencia: transferencia.queue
      dlq: transferencia.dlq
    routing-key:
      transferencia: transferencia.routing-key
      dlq: transferencia.dlq.routing-key

logging:
  level:
    org.springframework: INFO
    org.hibernate: INFO
    compass.transferencia_bancaria_api: DEBUG
