spring:
  datasource:
    url: jdbc:h2:mem:transferenciadb;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false

app:
  rabbitmq:
    exchange:
      transferencia: transferencia.exchange
      dlx: transferencia.dlx
    queue:
      transferencia: transferencia.queue
      dlq: transferencia.dlq
    routing-key:
      transferencia: transferencia.routing-key
      dlq: transferencia.dlq.routing-key
